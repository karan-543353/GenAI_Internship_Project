<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Studio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-color: #6366f1;
            --text-color: #f8fafc;
        }
        body {
            font-family: system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        h2 { margin-top: 0; color: #fff; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: #94a3b8; }
        input, textarea {
            width: 100%; padding: 10px; box-sizing: border-box;
            background: #0f172a; border: 1px solid #334155;
            border-radius: 6px; color: #fff; font-size: 14px;
        }
        button {
            width: 100%; padding: 12px; border: none; border-radius: 6px;
            background: var(--accent-color); color: white; font-weight: 600;
            cursor: pointer; transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .preview-box {
            border: 2px dashed #334155; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; min-height: 350px; background: #0f172a;
        }
        #outputImage { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1); width: 36px; height: 36px;
            border-radius: 50%; border-left-color: var(--accent-color);
            animation: spin 1s linear infinite; display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div>
        <h2>🎨 AI Generation Panel</h2>
        <div class="form-group">
            <label for="prompt">Prompt</label>
            <textarea id="prompt" rows="3" placeholder="A magical forest with glowing mushrooms..."></textarea>
        </div>
        <div class="form-group">
            <label for="negativePrompt">Negative Prompt</label>
            <input type="text" id="negativePrompt" value="blurry, distorted, low quality">
        </div>
        <button id="generateBtn">Generate Artwork</button>
    </div>

    <div>
        <h2>🖼️ Output Render</h2>
        <div class="preview-box">
            <div id="loadingSpinner" class="spinner"></div>
            <span id="placeholderText" style="color: #475569;">Your image will appear here</span>
            <img id="outputImage" alt="AI Generated Graphic">
        </div>
    </div>
</div>

<script>
    document.getElementById('generateBtn').addEventListener('click', async () => {
        const prompt = document.getElementById('prompt').value;
        const negativePrompt = document.getElementById('negativePrompt').value;
        
        const btn = document.getElementById('generateBtn');
        const spinner = document.getElementById('loadingSpinner');
        const placeholder = document.getElementById('placeholderText');
        const img = document.getElementById('outputImage');

        if (!prompt) return alert("Please enter a text prompt first!");

        // Toggle Loading State UI
        btn.disabled = true;
        btn.innerText = "Processing Diffusion...";
        spinner.style.display = "block";
        placeholder.style.display = "none";
        img.style.display = "none";

        try {
            // Send the network request directly to the FastAPI Backend
            const response = await fetch('http://127.0.0.1:8000/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prompt: prompt,
                    negative_prompt: negativePrompt
                })
            });

            if (!response.ok) throw new Error("Backend server error");

            // Receive the raw image file blob stream
            const blob = await response.blob();
            const objectURL = URL.createObjectURL(blob);
            
            // Render it in the image tag
            img.src = objectURL;
            img.style.display = "block";
        } catch (error) {
            console.error(error);
            alert("Failed to connect to the backend server.");
            placeholder.style.display = "block";
        } finally {
            // Restore UI state
            btn.disabled = false;
            btn.innerText = "Generate Artwork";
            spinner.style.display = "none";
        }
    });
</script>
</body>
</html>
